# Example only: adjust paths, encoder, and device lines for your host.
# See README "Headless / Docker (Unraid)" before uncommenting GPU lines.
services:
  hevc-pipeline:
    build: .
    volumes:
      - /mnt/user/media:/mnt/media:rw
      - ./state:/app/state
    # NVIDIA NVENC (needs NVIDIA Container Toolkit on the host):
    # deploy:
    #   resources:
    #     reservations:
    #       devices: [{capabilities: [gpu]}]
    # Intel Quick Sync:
    # devices:
    #   - /dev/dri:/dev/dri
    command: >
      python pipeline.py --scan-dir /mnt/media --db /app/state/state.db
      --encoder x265 --jobs 1
  # Optional dashboard (read-only queue view). It has NO auth, so
  # the port mapping below binds loopback only on purpose: reach
  # it from the host, not the LAN. For LAN access put it behind a
  # reverse proxy with auth instead of changing 127.0.0.1 to 0.0.0.0.
  # hevc-dashboard:
  #   build: .
  #   volumes:
  #     - ./state:/app/state:ro
  #   ports:
  #     - "127.0.0.1:5000:5000"
  #   command: >
  #     python dashboard.py --db /app/state/state.db
  #     --host 0.0.0.0 --port 5000
