name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install the package
        # Installs the console scripts and their runtime deps
        # (Flask for the dashboard test). pyproject pins floors
        # only, no lockfile yet.
        run: python -m pip install -e .
      - name: Install ffmpeg (Ubuntu)
        # GitHub's runner images do NOT ship ffmpeg/ffprobe, and
        # every encode suite builds its fixtures with them — without
        # this step the suites died with FileNotFoundError (seen
        # 2026-10-31 on the 3.11 job; all six jobs were affected).
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg
      - name: Install ffmpeg (Windows)
        # choco's ffmpeg shim lands in C:\ProgramData\chocolatey\bin,
        # which is already on PATH, so later steps find it.
        if: runner.os == 'Windows'
        run: choco install ffmpeg -y
      - name: Compile all scripts
        run: python -m compileall -q . tests
      - name: Run test suites
        # The encode suites run for real now that ffmpeg is
        # installed above; if ffmpeg/ffprobe are ever absent
        # (a local checkout without them, a failed install step),
        # they exit 0 with a SKIP message instead of crashing —
        # that fallback is real code in each suite's main(),
        # not just this comment. test_dashboard.py likewise
        # skips when Flask is missing.
        run: |
          python tests/test_smoke.py
          python tests/test_dvd_ingest.py
          python tests/test_camcorder_ingest.py
          python tests/test_swap_originals.py
          python tests/test_dashboard.py
